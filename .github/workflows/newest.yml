name: Update Test Branch

on:
  push:
    branches: [master]
    
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository
        run: python -m unittest discover -s tests
