name: Update Test Branch

on:
  push:
    branches: [master]
    
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("funread").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON snapshots are valid")
          PY
